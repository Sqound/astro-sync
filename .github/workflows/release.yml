name: Release

# Builds Astro Sync (the desktop application and its command line, `astro-sync`)
# for macOS, Windows and Linux, signs what can be signed, and gathers the files
# in a DRAFT GitHub release: nothing is public until a maintainer publishes the
# draft. It is the repository's only workflow and it runs on nothing else than:
#
#   - a version tag pushed (`v1.0.1`): the files go to the draft release of
#     that tag (created when there is none);
#   - a run started by hand ("Actions" tab, "Run workflow"): the files are kept
#     as the run's artifacts, and with `draft_release` they also go to the
#     draft release `v<version of the manifests>`, whose tag is created on the
#     run's commit only when the draft is published.
#
# No push to a branch, no pull request, no schedule. A release that is already
# published is never touched: the run stops and asks for a new version.
#
# Files, named WITHOUT a version so that the links
# `releases/latest/download/<file>` never name one:
#
#   Astro-Sync_macos_arm64.dmg          Astro-Sync_macos_x64.dmg
#   Astro-Sync_windows_x64-setup.exe
#   Astro-Sync_linux_x64.AppImage       Astro-Sync_linux_x64.deb
#   astro-sync-cli_macos_arm64.tar.gz   astro-sync-cli_macos_x64.tar.gz
#   astro-sync-cli_windows_x64.zip      astro-sync-cli_linux_x64.tar.gz
#   SHA256SUMS.txt                      the checksums of every file of the release
#
# Signing. Each system is signed when ALL of its secrets are set (repository
# settings, "Secrets and variables" > "Actions"); with none of them it is built
# UNSIGNED and the run says so (a warning, the run's summary, the release
# notes); with only some of them the run fails, so that a forgotten secret never
# turns into an unsigned file by surprise.
#
#   macOS    APPLE_CERTIFICATE           the "Developer ID Application"
#                                        certificate and its key, a .p12 in base64
#            APPLE_CERTIFICATE_PASSWORD  the password of that .p12
#            APPLE_SIGNING_IDENTITY      its name ("Developer ID Application: ...")
#            APPLE_API_KEY               the id of an Apple API key for notarization
#            APPLE_API_ISSUER            the issuer id of that key
#            APPLE_API_KEY_CONTENT       the contents of its .p8 file
#            The .app is signed and notarized by Tauri; the .dmg is signed by
#            Tauri, then notarized and stapled here.
#   Windows  SIGNPATH_API_TOKEN          the API token of a SignPath user who may
#                                        submit signing requests for the project
#            SIGNPATH_ORGANIZATION_ID    the SignPath organization's identifier
#            The installer and astro-sync.exe are signed by SignPath (the
#            certificate of the SignPath Foundation for open-source projects).
#   Linux    no signature: the .deb and the .AppImage are checked against
#            SHA256SUMS.txt.
#
# Only actions published by GitHub (`actions/*`) and the SignPath action are
# used, so the repository may allow those alone.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      draft_release:
        description: "Also put the files in the DRAFT release v<version of the manifests> (nothing is published)."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "24"
  # linuxdeploy (the AppImage) needs FUSE, which runners may lack.
  APPIMAGE_EXTRACT_AND_RUN: "1"

jobs:
  version:
    name: Version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: One version in every manifest (and in the tag)
        id: read
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          node - <<'JS'
            const fs = require("fs");
            const cargo = (file, section) =>
              (fs.readFileSync(file, "utf8").match(new RegExp(`\\[${section}\\][^[]*?version\\s*=\\s*"([^"]+)"`, "s")) || [])[1];
            const found = {
              "app/src-tauri/tauri.conf.json": JSON.parse(fs.readFileSync("app/src-tauri/tauri.conf.json", "utf8")).version,
              "app/package.json": JSON.parse(fs.readFileSync("app/package.json", "utf8")).version,
              "app/src-tauri/Cargo.toml": cargo("app/src-tauri/Cargo.toml", "package"),
              "Cargo.toml (workspace)": cargo("Cargo.toml", "workspace\\.package"),
            };
            console.log(found);
            const versions = new Set(Object.values(found));
            if (versions.size !== 1 || versions.has(undefined)) {
              console.error("The version is not the same in every file above.");
              process.exit(1);
            }
            const version = [...versions][0];
            const tag = `v${version}`;
            if (process.env.EVENT === "push" && process.env.REF_NAME !== tag) {
              console.error(`The tag ${process.env.REF_NAME} is not the version of the manifests (${tag}).`);
              process.exit(1);
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\ntag=${tag}\n`);
          JS

  macos:
    name: macOS ${{ matrix.arch }}
    needs: version
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            triple: aarch64-apple-darwin
          - arch: x64
            triple: x86_64-apple-darwin
    outputs:
      signed: ${{ steps.mode.outputs.signed }}
    steps:
      - name: Signed or unsigned
        id: mode
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          names="APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_CONTENT"
          set_count=0; missing=""
          for name in $names; do
            if [ -n "${!name:-}" ]; then set_count=$((set_count + 1)); else missing="$missing $name"; fi
          done
          if [ "$set_count" -eq 6 ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Apple secrets found: this run is SIGNED and NOTARIZED."
          elif [ "$set_count" -eq 0 ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Unsigned macOS build::No Apple secrets: the .dmg is neither signed nor notarized (macOS will refuse to open it until the user allows it)."
            echo "- macOS ${{ matrix.arch }}: **UNSIGNED** (no Apple secrets)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error title=Incomplete Apple secrets::Missing:$missing. Set all six to sign, or none to build unsigned."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Rust toolchain (rust-toolchain.toml) and the target
        run: |
          channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --target "${{ matrix.triple }}"
          rustc --version

      - name: Install the interface
        working-directory: app
        run: npm ci

      - name: Build, sign, notarize and staple the .dmg
        working-directory: app
        env:
          SIGNED: ${{ steps.mode.outputs.signed }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          TRIPLE: ${{ matrix.triple }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          if [ "$SIGNED" = true ]; then
            key_file="$RUNNER_TEMP/notary-key.p8"
            (umask 077; printf '%s' "$APPLE_API_KEY_CONTENT" > "$key_file")
            export APPLE_API_KEY_PATH="$key_file"
          else
            # An empty value would be read as a certificate: unset them all.
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                  APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_CONTENT
          fi

          npm run tauri -- build --target "$TRIPLE" --bundles app,dmg

          dmg="$(find "src-tauri/target/$TRIPLE/release/bundle/dmg" -name '*.dmg' -print -quit)"
          test -n "$dmg"

          if [ "$SIGNED" = true ]; then
            # Tauri notarizes the .app; the .dmg is notarized and stapled here.
            xcrun notarytool submit "$dmg" --key "$key_file" --key-id "$APPLE_API_KEY" \
              --issuer "$APPLE_API_ISSUER" --wait
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
            spctl -a -vv -t install "$dmg"
            rm -f "$key_file"
          fi

          mkdir -p ../dist
          cp "$dmg" "../dist/Astro-Sync_macos_${ARCH}.dmg"

      - name: Build the command line
        env:
          TRIPLE: ${{ matrix.triple }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          cargo build --release -p astro-sync-cli --target "$TRIPLE"
          tar -C "target/$TRIPLE/release" -czf "dist/astro-sync-cli_macos_${ARCH}.tar.gz" astro-sync

      - uses: actions/upload-artifact@v4
        with:
          name: astro-sync-macos-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows x64
    needs: version
    runs-on: windows-2022
    permissions:
      contents: read
      actions: read
    outputs:
      signed: ${{ steps.mode.outputs.signed }}
    steps:
      - name: Signed or unsigned
        id: mode
        shell: bash
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
        run: |
          if [ -n "$SIGNPATH_API_TOKEN" ] && [ -n "$SIGNPATH_ORGANIZATION_ID" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "SignPath secrets found: this run is SIGNED (SignPath)."
          elif [ -z "$SIGNPATH_API_TOKEN" ] && [ -z "$SIGNPATH_ORGANIZATION_ID" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Unsigned Windows build::No SignPath secrets: the Windows files of this run are UNSIGNED (SmartScreen will warn when the installer is opened)."
            echo "- Windows x64: **UNSIGNED** (no SignPath secrets)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error title=Incomplete SignPath secrets::Set both SIGNPATH_API_TOKEN and SIGNPATH_ORGANIZATION_ID to sign, or neither to build unsigned."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Rust toolchain (rust-toolchain.toml)
        shell: bash
        run: |
          channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal
          rustc --version

      - name: Install the interface
        working-directory: app
        run: npm ci

      - name: Build the installer and the command line
        shell: bash
        run: |
          set -euo pipefail
          (cd app && npm run tauri -- build --bundles nsis)
          cargo build --release -p astro-sync-cli
          exe="$(find app/src-tauri/target/release/bundle/nsis -name '*-setup.exe' -print -quit)"
          test -n "$exe"
          mkdir -p unsigned
          cp "$exe" unsigned/Astro-Sync_windows_x64-setup.exe
          cp target/release/astro-sync.exe unsigned/astro-sync.exe

      - name: Upload the unsigned files for SignPath
        id: unsigned
        if: steps.mode.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: signpath-input-windows
          path: unsigned/*
          if-no-files-found: error
          retention-days: 1

      - name: Sign with SignPath
        if: steps.mode.outputs.signed == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: astro-sync
          signing-policy-slug: release-signing
          artifact-configuration-slug: windows-release
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: The signatures are valid
        if: steps.mode.outputs.signed == 'true'
        shell: pwsh
        run: |
          foreach ($file in "signed/Astro-Sync_windows_x64-setup.exe", "signed/astro-sync.exe") {
            $signature = Get-AuthenticodeSignature $file
            Write-Host "$file : $($signature.Status) ($($signature.SignerCertificate.Subject))"
            if ($signature.Status -ne "Valid") { throw "$file is not validly signed." }
          }

      - name: Gather the files
        shell: pwsh
        env:
          SIGNED: ${{ steps.mode.outputs.signed }}
        run: |
          $source = if ($env:SIGNED -eq "true") { "signed" } else { "unsigned" }
          Write-Host "Windows files: $source."
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "$source/Astro-Sync_windows_x64-setup.exe" dist/
          Compress-Archive -Path "$source/astro-sync.exe" -DestinationPath dist/astro-sync-cli_windows_x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: astro-sync-windows-x64
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux x64
    needs: version
    # The oldest runner still supported: what is built here (the glibc of the
    # system, 2.35, and the WebKitGTK the AppImage carries) runs on Ubuntu 22.04
    # and every newer system, never on an older one.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: The build dependencies of Tauri 2 and of the keyring test
        run: |
          echo "- Linux x64: not signed (the .deb and the .AppImage are checked against SHA256SUMS.txt)" >> "$GITHUB_STEP_SUMMARY"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file pkg-config patchelf \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev xdg-utils \
            dbus gnome-keyring libsecret-tools

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Rust toolchain (rust-toolchain.toml)
        run: |
          channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal
          rustc --version

      - name: Install the interface
        working-directory: app
        run: npm ci

      - name: Secret Service smoke test (a private session bus and a throw-away keyring)
        run: bash tool/keyring-smoke.sh

      - name: Build the .deb, the .AppImage and the command line
        run: |
          set -euo pipefail
          (cd app && npm run tauri -- build --bundles deb,appimage)
          cargo build --release -p astro-sync-cli
          bundle=app/src-tauri/target/release/bundle
          mkdir -p dist
          cp "$(find "$bundle/deb" -name '*.deb' -print -quit)" dist/Astro-Sync_linux_x64.deb
          cp "$(find "$bundle/appimage" -name '*.AppImage' -print -quit)" dist/Astro-Sync_linux_x64.AppImage
          tar -C target/release -czf dist/astro-sync-cli_linux_x64.tar.gz astro-sync

      - uses: actions/upload-artifact@v4
        with:
          name: astro-sync-linux-x64
          path: dist/*
          if-no-files-found: error

  release:
    name: Draft release
    needs: [version, macos, windows, linux]
    if: github.event_name == 'push' || inputs.draft_release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: astro-sync-*
          path: dist
          merge-multiple: true

      - name: Every file, under its name
        working-directory: dist
        run: |
          set -euo pipefail
          ls -l
          expected="Astro-Sync_linux_x64.AppImage Astro-Sync_linux_x64.deb Astro-Sync_macos_arm64.dmg
            Astro-Sync_macos_x64.dmg Astro-Sync_windows_x64-setup.exe astro-sync-cli_linux_x64.tar.gz
            astro-sync-cli_macos_arm64.tar.gz astro-sync-cli_macos_x64.tar.gz astro-sync-cli_windows_x64.zip"
          for file in $expected; do test -s "$file" || { echo "::error::Missing: $file"; exit 1; }; done
          [ "$(ls | wc -l)" -eq 9 ] || { echo "::error::Unexpected files in the release."; exit 1; }

      - name: Notes (said once, when the draft is created)
        env:
          VERSION: ${{ needs.version.outputs.version }}
          MACOS_SIGNED: ${{ needs.macos.outputs.signed }}
          WINDOWS_SIGNED: ${{ needs.windows.outputs.signed }}
        run: |
          set -euo pipefail
          if [ "$MACOS_SIGNED" = true ]; then
            macos="signed and notarized"
          else
            macos="NOT signed: macOS refuses to open it until you allow it in System Settings > Privacy & Security"
          fi
          if [ "$WINDOWS_SIGNED" = true ]; then
            windows="signed (SignPath Foundation)"
          else
            windows="not yet signed: Windows SmartScreen may warn, choose \"More info\", then \"Run anyway\""
          fi
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          Astro Sync $VERSION, the desktop companion of Astro Portal.

          - macOS, Apple silicon: \`Astro-Sync_macos_arm64.dmg\`; Intel: \`Astro-Sync_macos_x64.dmg\` ($macos).
          - Windows x64: \`Astro-Sync_windows_x64-setup.exe\` ($windows).
          - Linux x64 (Ubuntu 22.04 or newer): \`Astro-Sync_linux_x64.deb\` and \`Astro-Sync_linux_x64.AppImage\` (not signed).
          - The command line: \`astro-sync-cli_macos_arm64.tar.gz\`, \`astro-sync-cli_macos_x64.tar.gz\`, \`astro-sync-cli_windows_x64.zip\`, \`astro-sync-cli_linux_x64.tar.gz\`.

          \`SHA256SUMS.txt\` lists the checksums of every file. See CHANGELOG.md.
          EOF
          cat "$RUNNER_TEMP/notes.md"

      - name: Into the draft release (never a published one)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if state="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$state" != true ]; then
              echo "::error title=Already published::The release $TAG is published: it is never replaced. Raise the version in the manifests and tag again."
              exit 1
            fi
            echo "The draft $TAG exists: its files are replaced."
          elif gh api "repos/$GH_REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag \
              --title "Astro Sync $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          else
            # Started by hand without the tag: the tag is made on this commit
            # when the draft is published.
            gh release create "$TAG" --draft --target "$GITHUB_SHA" \
              --title "Astro Sync $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release upload "$TAG" dist/* --clobber
          # The checksums of every file the draft holds now.
          mkdir -p all
          gh release download "$TAG" --dir all --clobber
          rm -f all/SHA256SUMS.txt
          (cd all && sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS.txt")
          cat "$RUNNER_TEMP/SHA256SUMS.txt"
          gh release upload "$TAG" "$RUNNER_TEMP/SHA256SUMS.txt" --clobber
          echo "Draft release $TAG ready: $(gh release view "$TAG" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"
